name: Fahrhilfe-Kartendaten

# Lädt die Stoppschilder / Rechts-vor-links-Kreuzungen für die Fahrhilfe
# aus OpenStreetMap und legt sie als fahrhilfe/data.json ins Repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fahrhilfe/core.js'
      - 'fahrhilfe/build-data.js'
      - '.github/workflows/fahrhilfe-daten.yml'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten laden und auswerten
        run: node fahrhilfe/build-data.js
      - name: data.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fahrhilfe/data.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Fahrhilfe: Kartendaten aktualisiert"
          git pull --rebase origin main
          git push
